name: Verify release candidate

# Builds reviewable artifacts; never creates a tag, GitHub release or npm publish.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    # Attest only the maintained default branch, never arbitrary PR code.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm audit --audit-level=high
      - run: pnpm exec playwright install --with-deps chromium --no-shell
      - run: pnpm run test:browser
      - run: pnpm pack --pack-destination artifacts/release
      - run: node scripts/prepare-release.js
      - run: node scripts/verify-release-install.js
      - name: Attest public-repository build artifacts
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/release/*.zip
            artifacts/release/*.tgz
            artifacts/release/release-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ github.sha }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 30
